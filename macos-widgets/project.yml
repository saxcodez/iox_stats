# XcodeGen spec: generates IOXStats.xcodeproj  (brew install xcodegen && xcodegen generate)
# Contains: the small host app "IOX Stats" and the WidgetKit extension "IOX Stats Widgets".
name: IOXStats

options:
  bundleIdPrefix: com.saxcodez
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"          # keep equal to iox_stats.__version__ (checked by scripts/check_version.py)
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""                # set your team in Xcode (Signing & Capabilities) or put the team ID here
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  IOXStats:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - App.entitlements
      - path: Shared
    dependencies:
      - target: IOXStatsWidgets
        embed: true
    entitlements:
      # XcodeGen WRITES this file on every "xcodegen generate" from the properties below - edit them here,
      # not in the .entitlements file (an entry missing here silently disappears from the signed app).
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/IOXStats/
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: IOX Stats
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saxcodez.IOXStats
        PRODUCT_NAME: IOX Stats

  IOXStatsWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Widget.entitlements
      - path: Shared
    entitlements:
      # Written by XcodeGen from these properties (see the app target). macOS rejects widgets that are not
      # sandboxed: "plug-ins must be sandboxed".
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/IOXStats/
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: IOX Stats
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saxcodez.IOXStats.Widgets
        PRODUCT_NAME: IOXStatsWidgets
        SKIP_INSTALL: YES
