[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iox-stats"
dynamic = ["version"]
description = "macOS system status in iOS widget style: menu bar readout, glass widgets and a widget gallery widget (CPU, RAM, disk, network, ping, temperature)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "saxcodez" }]
classifiers = [
    "License :: Free for non-commercial use",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PySide6-Essentials>=6.7",
    "psutil>=5.9",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/saxcodez/iox_stats"
Issues = "https://github.com/saxcodez/iox_stats/issues"
Changelog = "https://github.com/saxcodez/iox_stats/blob/main/CHANGELOG.md"

[project.scripts]
iox-stats = "iox_stats.app:main"

[tool.setuptools.dynamic]
version = { attr = "iox_stats.__version__" }

[tool.setuptools.packages.find]
include = ["iox_stats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
